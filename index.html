<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Рождения, Майонез!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="confetti">
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
        <div class="confetti-piece"></div>
    </div>

    <main class="card">
        <div class="mayo-jar">
            <div class="lid"></div>
            <div class="jar-body">
                <div class="label">
                    <span class="label-text">МАЙОНЕЗ</span>
                    <span class="label-heart"></span>
                </div>
            </div>
            <div class="shine"></div>
        </div>

        <h1 class="title">
            <span>С</span>
            <span>Днём</span>
            <span>Рождения,</span>
            <span class="highlight">Майонез!</span>
        </h1>

        <p class="subtitle">Самому вкусному, нежному и незаменимому!</p>

        <div class="wishes">
            <p>Пусть твоя жизнь будет такой же:</p>
            <ul>
                <li>Белоснежной, как ты!</li>
                <li>Густой и насыщенной!</li>
                <li>И всегда на столе!</li>
            </ul>
        </div>

        <div class="cake">
            <div class="cake-layer"></div>
            <div class="cake-layer"></div>
            <div class="cake-layer"></div>
            <div class="candle">
                <div class="flame"></div>
            </div>
        </div>

        <p class="signature">С любовью, твои друзья</p>
    </main>
</body>
</html>
